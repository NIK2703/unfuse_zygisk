# sdcardfs_restore.conf — настройка модуля sdcardfs-restore.
#
# Этот файл лежит в архиве модуля и при установке копируется в /data/adb/ —
# уже оттуда его читает storage.sh. Копия в /data/adb/ переустановку переживает:
# customize.sh создаёт её только тогда, когда её ещё нет. Поэтому правки,
# сделанные здесь, НЕ применяются к уже установленному модулю — правьте
# /data/adb/sdcardfs_restore.conf на устройстве (или пользуйтесь path-mode.sh).
#
# Формат — key=value, по строке на ключ. Всё после `#` — комментарий. Разбор
# делает storage.sh сам, шеллом файл не подключается (source): конфиг лежит в
# /data/adb, куда пишет кто угодно, а исполнять оттуда код модуль не должен.
#
# --------------------------------------------------------------------------
# path — каким путём модуль отдаёт приложениям внутреннюю память.
#
#   auto      (по умолчанию) — поднять sdcardfs на /mnt/runtime/*/emulated, а
#             если ядро sdcardfs не умеет (нет в /proc/filesystems) или маунт не
#             встал — уйти на альтернативный путь: сырое дерево /data/media плюс
#             ACL на группу 9997 (AID_EVERYBODY). Так модуль ведёт себя «сам»,
#             без настроек, и так же работает на чужих устройствах.
#
#   sdcardfs  — только основной путь. Если sdcardfs в ядре нет или маунт не
#             встал, модуль НЕ уходит на альтернативный и пишет в журнал, что
#             приложения останутся без памяти. Строгий режим: он нужен, чтобы
#             отлаживать основной путь и не получать молчаливую подмену.
#
#   raw       — только альтернативный путь. Модуль не поднимает sdcardfs, а
#             если тот уже поднят (например, ядро его умеет и прошлая загрузка
#             его смонтировала) — снимает маунты, чтобы приложения ушли на
#             сырое дерево. Это тот же режим, что включал временный файл
#             /data/adb/sdcardfs_restore.force_raw; сам файл оставлен как
#             синоним и продолжает работать.
#
# Значение по умолчанию — auto. Пустая строка или неизвестное значение тоже
# означают auto: модуль не должен остаться без памяти из-за опечатки в конфиге.
#
# --------------------------------------------------------------------------
# Примеры:
#
#   path=auto        # как есть по умолчанию
#   path=sdcardfs    # строго основной путь
#   path=raw         # строго сырое дерево + ACL
#
path=auto
