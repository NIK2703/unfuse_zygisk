# unfuse_zygisk.conf — module settings.
#
# Ships inside the module and is read from there by storage.sh. The module
# directory is rewritten on every install, so customize.sh carries this setting
# over from the previous install — but an edit made to the copy in the source
# tree still does not reach an installed module. On the device, edit the file in
# /data/adb/modules/unfuse_zygisk/ or just use path-mode.sh.
#
# Format: key=value, one per line; everything after `#` is a comment. storage.sh
# parses the file rather than sourcing it: anything with root can write it, and
# the module must not execute code from its own directory.
#
# path — how internal storage is exposed to apps:
#
#   auto      (default) sdcardfs first: mount it on /mnt/runtime/*/emulated and
#             verify by fact that the points are sdcardfs carrying the requested
#             mask and gid. If the kernel lacks sdcardfs or the check fails, the
#             mounts are torn down and the module falls back to the raw tree
#             /data/media with an ACL for group 9997 (AID_EVERYBODY).
#
#   sdcardfs  main path only, strictly: no fallback. On any failure the module
#             logs what did not match and leaves everything as is.
#
#   acl       fallback only: sdcardfs is not mounted and existing mounts are torn
#             down so apps move to the raw tree. Formerly called raw; both names
#             work, as does the old marker file
#             /data/adb/unfuse_zygisk.force_raw.
#
#   fuse      the raw tree, with vold's FUSE mount cut off at the source: instead
#             of living alongside that mount and contending with it for
#             permissions, the module redirects vold's own mount() trampoline so
#             MountUserFuse() binds /data/media onto the target rather than
#             mounting FUSE on it. No FUSE superblock is created for emulated
#             storage at all, so there is no mediator between an app and the
#             disk; /data/media is reached directly, through the same VFS and
#             page cache as /data itself. The ACL pass still runs, because the
#             raw tree has to be made reachable, but it is no longer competing
#             with anything. See tools/vold-fusefs.c.
#
# Empty or unknown values mean auto: a typo must not leave the module without
# storage.
#
# Examples:
#
#   path=auto        # the default
#   path=sdcardfs    # main path only
#   path=acl         # raw tree + ACL only (formerly raw)
#   path=fuse        # raw tree, FUSE cut off in vold
#
path=auto
